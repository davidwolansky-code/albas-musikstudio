<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Albas Musikstudio</title>
<style>
:root{--ink:#3b2a63;--pri:#7c4dff;--ac:#ffc400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px;
 background:linear-gradient(160deg,#ffe3f1,#dff1ff 55%,#fff4c9);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,input{font:inherit}
header{display:flex;align-items:center;gap:8px}
h1{font-size:clamp(16px,3vw,26px);margin:0;white-space:nowrap}
.sp{flex:1}
.btn{border:0;border-radius:14px;padding:8px 12px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(60,30,120,.18);cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,30,120,.18)}
.btn.on{background:var(--pri);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:11px}
.banner{display:flex;align-items:center;gap:8px;background:#fff3b0;border:2px dashed #e0a800;border-radius:14px;padding:6px 10px;font-weight:700}
.banner[hidden]{display:none}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:16px;padding:6px 12px;background:#fff;font-weight:700;color:var(--ink);box-shadow:0 3px 0 rgba(60,30,120,.18);cursor:pointer;touch-action:manipulation}
.tab .ic{font-size:22px;line-height:1}
.tab.on{background:linear-gradient(135deg,#7c4dff,#ff5bb5);color:#fff}
#ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ctl select{border:0;border-radius:12px;padding:6px 8px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(60,30,120,.18);max-width:100%}
.seg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.55);border-radius:14px;padding:3px 5px}
#stage{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;position:relative}
#laneWrap{position:relative;flex:0 0 clamp(110px,28vh,260px);border-radius:16px;background:#2b1f4d;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
#lane{width:100%;height:100%;display:block}
#fb{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(20px,5vw,40px);color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.6);pointer-events:none;opacity:0}
#fb.show{animation:fbp .9s ease-out forwards}
@keyframes fbp{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
#ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;
 font-weight:900;font-size:clamp(28px,9vw,90px);color:#fff;text-shadow:0 4px 14px rgba(40,10,90,.8);background:rgba(40,20,90,.35);border-radius:16px;pointer-events:none}
#ov{white-space:pre-line}
#ov[hidden]{display:none}
#ov.hint{font-size:clamp(16px,3.4vw,30px);pointer-events:auto;cursor:pointer}
#inst{flex:1;min-height:clamp(150px,36vh,360px);display:flex;flex-direction:column;gap:6px;position:relative}
#tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#tools:empty{display:none}
#play>*{min-height:0}
#play{flex:1;min-height:0;display:flex;position:relative;border-radius:16px}
[data-t]{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.kb{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 5px;font:700 11px/16px ui-monospace,monospace;pointer-events:none;z-index:3}
.dim{opacity:.55}
/* xylofon */
.xylo{flex:1;display:flex;gap:clamp(3px,1vw,10px);align-items:flex-end;padding:0 4px}
.xylo .bar{flex:1;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 26px;transition:transform .08s,filter .08s}
.xylo .bar i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#9aa);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.xylo .bar b{color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);font-size:clamp(12px,2vw,20px)}
.on{filter:brightness(1.25) saturate(1.2)}
.xylo .bar.on,.pad.on,.key.on{transform:translateY(4px) scale(.97)}
/* piano */
.piano{flex:1;position:relative;display:flex;padding:0 2px 6px}
.key.w{flex:1;background:linear-gradient(#fff,#f2f0ff);border:2px solid #b9aee0;border-top:0;border-radius:0 0 12px 12px;margin:0 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:24px;color:var(--ink);font-weight:800;font-size:clamp(10px,1.6vw,15px)}
.key.w .dot{width:clamp(10px,2vw,18px);height:clamp(10px,2vw,18px);border-radius:50%;background:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.key.w.on{background:linear-gradient(#e7dcff,#cdbcff)}
.key.b{position:absolute;top:0;height:60%;width:calc(100%/14*.62);background:linear-gradient(#4a3a78,#1f1638);border-radius:0 0 9px 9px;z-index:2;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.key.b.on{background:linear-gradient(#8a6bff,#4b2fb8)}
/* gitarr/bas */
.gt{flex:1;display:flex;gap:10px;min-height:0}
.chords{flex:0 0 38%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad{border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);text-shadow:0 2px 3px rgba(0,0,0,.35);font-size:clamp(13px,2.4vw,24px);transition:transform .08s}
.strings{flex:1;display:flex;flex-direction:column;justify-content:space-around;background:linear-gradient(90deg,#8d5a2b,#b97a3c);border-radius:14px;padding:4px 10px;box-shadow:inset 0 0 0 3px #5e3a18}
.str{flex:1;display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:12px}
.str .ln{flex:1;height:calc(2px + var(--w)*1px);background:linear-gradient(#f4f4f4,#a9a9a9);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.str.on .ln{animation:vib .09s linear infinite}
.str.on{filter:none}
@keyframes vib{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
.bs{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.bs .strings{flex:0 0 42%}
.bs .btns{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
/* blås */
.wind{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.wsvg{display:block;width:100%;height:100%;background:rgba(255,255,255,.55);border-radius:16px}
.wsvg .wg{display:none}
.wsvg.k-trumpet .wg-trumpet,.wsvg.k-tuba .wg-trumpet,.wsvg.k-sax .wg-sax,.wsvg.k-clar .wg-clar,.wsvg.k-flute .wg-flute,.wsvg.k-trom .wg-trom{display:inline}
.wsvg.k-tuba{--brass:#e08a00;--brassd:#9a5a00}
.brass{fill:var(--brass,#ffc400);stroke:var(--brassd,#b88700);stroke-width:3;stroke-linejoin:round}
.vv{transition:transform .06s}.vv.dn{transform:translateY(10px)}
.kk{fill:#fff;stroke:#555;stroke-width:2.5;transition:fill .06s}.kk.dn{fill:#ff5bb5}
.slide{transition:transform .15s}
.wbtns{flex:0 0 46%;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.wbtns .pad{font-size:clamp(14px,2.6vw,26px)}
input[type=range]{touch-action:pan-x;accent-color:var(--pri);width:clamp(90px,24vw,220px)}
/* dragspel */
.acc{flex:1;display:flex;gap:6px;min-height:0}
.accL{flex:0 0 22%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:6px;align-content:stretch}
.accL .pad{border-radius:50%;aspect-ratio:auto;font-size:clamp(11px,2vw,18px)}
.bel{flex:1;min-width:30px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ew-resize}
.bel div{height:92%;width:100%;transform-origin:center;transform:scaleX(var(--sx,1));background:repeating-linear-gradient(90deg,#7a1c3a 0 7px,#d4486a 7px 14px);border-radius:10px;box-shadow:inset 0 0 0 4px #40101f,0 4px 0 rgba(0,0,0,.25)}
.accR{flex:0 0 46%;display:flex;gap:4px}
.accR .pad{flex:1;border-radius:10px 10px 18px 18px;align-items:flex-end;padding-bottom:26px}
/* harpa */
.harp{flex:1;display:flex;gap:2px;padding:4px;background:linear-gradient(180deg,#fff6d6,#ffe9a8);border-radius:16px;box-shadow:inset 0 0 0 4px #c99a1d}
.hs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 22px}
.hs .nb{background:var(--c);color:#fff;border-radius:8px;padding:1px 3px;font-size:clamp(9px,1.5vw,13px);font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.hs .ln{flex:1;width:4px;margin:3px 0;border-radius:3px;background:linear-gradient(90deg,#fff,var(--c));box-shadow:0 0 6px var(--c)}
.hs.on .ln{animation:hv .08s linear infinite;width:6px}
@keyframes hv{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
/* tamburin */
.tw{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;min-height:0}
.tamb{height:min(100%,62vw);aspect-ratio:1;border-radius:50%;position:relative}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#a5662f 55%,#7a4519 100%);box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 5px #5e3412;padding:17%}
.ctr{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7e0,#f3d9a4);box-shadow:inset 0 0 0 4px #d9b76d;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,34px);font-weight:900;color:#a5662f}
.jg{position:absolute;width:11%;height:11%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#b9c3cc);box-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none;left:44.5%;top:44.5%}
.tamb.on .jg{animation:jg .1s linear infinite}
@keyframes jg{50%{filter:brightness(1.5);scale:1.2}}
.tw .pad{flex:0 0 auto;min-width:min(24vw,170px);height:60%}
/* trummor */
.drums{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.drums .pad{font-size:clamp(13px,2.4vw,22px);flex-direction:column;gap:2px;border-radius:22px}
.drums .pad span{font-size:clamp(20px,4vw,38px)}
/* orkester */
.orc{flex:1;display:flex;gap:8px;min-height:0}
.scene{flex:0 0 34%;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sec{border-radius:16px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-align:center;font-size:clamp(11px,1.8vw,16px);transition:all .15s;border:3px solid transparent}
.sec span{font-size:clamp(24px,5vw,48px)}
.sec.lit{background:#fff3a0;border-color:#ffb300;box-shadow:0 0 22px #ffd54a;transform:scale(1.05)}
.ob{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px}
.ob .pad{font-size:clamp(10px,1.7vw,16px);padding:2px}
/* konfetti */
.cf{position:absolute;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:cfall 2.6s ease-in forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
/* kompakt & liggande */
body.compact{padding:2px;gap:3px}
body.compact h1{display:none}
body.compact header{justify-content:flex-end;min-height:0}
body.compact .btn{padding:3px 8px;font-size:12px}
body.compact .tab{padding:2px 8px}body.compact .tab .ic{font-size:17px}
@media (orientation:landscape) and (max-height:540px){
 body{padding:4px;gap:3px;height:100dvh}
 h1{font-size:15px}
 #ctl select{max-width:150px}
 .drums .pad span{font-size:20px}
 .drums .pad{font-size:12px}
 .grp{padding:2px 3px}
 .btn{padding:4px 9px;font-size:12px;border-radius:10px}
 .tab{padding:2px 9px;border-radius:12px;font-size:12px}.tab .ic{font-size:16px}
 #tabs{padding:1px 1px 3px}
 #ctl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 #ctl>*{flex:0 0 auto}
 #ctl select{padding:3px 6px;font-size:12px}
 #laneWrap{flex:0 0 27vh}
 #inst{min-height:0}
 #stage{gap:3px}
 #inst{gap:3px}
 .btn.sm{padding:2px 7px;font-size:11px}
 .pad{border-radius:11px}
}
@media (max-width:560px) and (orientation:portrait){.tab span.nm{display:none}.tab.on span.nm{display:inline}}
</style>
</head>
<body>
<div id="rot" class="banner" hidden><span>📱 Vrid mobilen till liggande läge för bästa spelkänsla!</span><button class="btn sm" id="rotx" aria-label="Stäng">✕</button></div>
<header>
 <h1>🎵 Albas Musikstudio</h1><span class="sp"></span>
 <button class="btn" id="stop" hidden>⏹ Stoppa</button>
 <button class="btn" id="fs">⛶ Helskärm</button>
</header>
<nav id="tabs"></nav>
<section id="ctl">
 <select id="song" aria-label="Välj låt"></select>
 <div class="grp" id="tempo"></div>
 <div class="grp" id="modes"></div>
 <button class="btn sm" id="wait">⏳ Vänta på mig: Av</button>
 <button class="btn sm on" id="metro">🔔 Metronom: På</button>
</section>
<main id="stage">
 <div id="laneWrap"><canvas id="lane"></canvas><div id="fb"></div></div>
 <div id="inst"><div id="tools"></div><div id="play"></div></div>
 <div id="ov" hidden></div>
</main>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const RB=['#ff4d4d','#ff9d3b','#f7c600','#8fd43a','#2fc96b','#22c7b8','#3b9cff','#6b5bff','#b05bff','#ff5bb5'];

/* ================= LJUD (Web Audio) ================= */
let ctx=null,master=null,reverbIn=null,noiseBuf=null;
function initAudio(){
  try{
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC();
      const comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-20;comp.knee.value=18;comp.ratio.value=10;comp.attack.value=0.004;comp.release.value=0.22;
      master=ctx.createGain();master.gain.value=0.75;
      master.connect(comp);comp.connect(ctx.destination);
      const len=(ctx.sampleRate*1.8)|0, ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
      const conv=ctx.createConvolver();conv.buffer=ir;
      reverbIn=ctx.createGain();
      const rg=ctx.createGain();rg.gain.value=0.35;
      reverbIn.connect(conv);conv.connect(rg);rg.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      const sb=ctx.createBufferSource();sb.buffer=ctx.createBuffer(1,1,22050);sb.connect(ctx.destination);sb.start(0);
    }
    if(ctx.state!=='running') ctx.resume();
  }catch(e){}
}
['pointerdown','keydown','touchend','click'].forEach(ev=>window.addEventListener(ev,initAudio,{capture:true}));

const nf=s=>261.6256*Math.pow(2,s/12);
const WH=[0,2,4,5,7,9,11], NN=['C','D','E','F','G','A','B'];
const wsemi=i=>12*Math.floor(i/7)+WH[i%7];
const wname=i=>NN[i%7]+(i>=7?(Math.floor(i/7)+1):'');

function out(node,wet){
  node.connect(master);
  if(wet>0&&reverbIn){const s=ctx.createGain();s.gain.value=wet;node.connect(s);s.connect(reverbIn);}
}
function nz(o){
  const t=o.t??ctx.currentTime;
  const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t,Math.random());s.stop(t+o.dur+0.1);
  const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||2000;f.Q.value=o.q||1;
  const g=ctx.createGain();g.gain.setValueAtTime(o.peak||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  s.connect(f);f.connect(g);out(g,o.wet||0);return g;
}
function sweep(t,f0,f1,dur,peak,type){
  const o=ctx.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.6);
  const g=ctx.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);out(g,0);o.start(t);o.stop(t+dur+0.05);
}
/* generell ton: parts=[{type,m,g,det}], hold=true -> sustain tills release() */
function tone(o){
  const t=o.t??ctx.currentTime, peak=o.peak??0.25, a=o.a??0.005;
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);
  const vol=ctx.createGain();vol.gain.value=1;
  const mix=ctx.createGain();let tail=mix,filt=null;
  if(o.lp){filt=ctx.createBiquadFilter();filt.type=o.ft||'lowpass';filt.frequency.setValueAtTime(o.lp,t);
    if(o.lpEnd)filt.frequency.exponentialRampToValueAtTime(o.lpEnd,t+(o.lpT||0.3));
    filt.Q.value=o.q||0.7;mix.connect(filt);tail=filt;}
  tail.connect(g);g.connect(vol);out(vol,o.wet||0);
  const oscs=[];let lg=null;
  if(o.vib){const lfo=ctx.createOscillator();lfo.frequency.value=5.2;lg=ctx.createGain();lg.gain.value=o.vib===true?14:o.vib;lfo.connect(lg);lfo.start(t);oscs.push(lfo);}
  for(const p of o.parts){
    const os=ctx.createOscillator();os.type=p.type;const m=p.m||1,f=o.f*m;
    if(o.glideFrom){os.frequency.setValueAtTime(o.glideFrom*m,t);os.frequency.linearRampToValueAtTime(f,t+(o.glideT||0.12));}
    else os.frequency.value=f;
    os.detune.value=p.det||0;
    const pg=ctx.createGain();pg.gain.value=p.g??1;os.connect(pg);pg.connect(mix);
    if(lg)lg.connect(os.detune);
    os.start(t);oscs.push(os);
  }
  if(o.noise){
    const ns=ctx.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;
    const nfl=ctx.createBiquadFilter();nfl.type='bandpass';nfl.frequency.value=o.noise.f;nfl.Q.value=o.noise.q||2;
    const ng=ctx.createGain();ng.gain.value=o.noise.g;ns.connect(nfl);nfl.connect(ng);ng.connect(mix);ns.start(t,Math.random());oscs.push(ns);
  }
  let done=false;const r=o.r??0.2;
  function rel(){
    if(done)return;done=true;if(!o.hold)return;
    const n=ctx.currentTime;g.gain.cancelScheduledValues(n);
    g.gain.setValueAtTime(Math.max(g.gain.value,0.0002),n);
    g.gain.exponentialRampToValueAtTime(0.0001,n+r);
    oscs.forEach(x=>{try{x.stop(n+r+0.05)}catch(e){}});
  }
  if(o.hold){
    g.gain.exponentialRampToValueAtTime(Math.max(peak*(o.s??0.7),0.0002),t+a+(o.d??0.3));
    setTimeout(rel,30000);
  }else{
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+o.dur);
    const end=t+a+o.dur+0.08;oscs.forEach(x=>{try{x.stop(end)}catch(e){}});
  }
  return {release:rel,vol,g,filt};
}
/* Karplus-Strong plockad sträng */
const ksCache={};
function ksBuf(f,bright,decay){
  const key=f.toFixed(1)+'|'+bright+'|'+decay;if(ksCache[key])return ksCache[key];
  const sr=ctx.sampleRate,len=(sr*2.3)|0,N=Math.max(2,Math.round(sr/f)),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),ring=new Float32Array(N);
  let prev=0;for(let i=0;i<N;i++){const r=Math.random()*2-1;ring[i]=prev=prev*(1-bright)+r*bright;}
  let idx=0,pk=0;
  for(let i=0;i<len;i++){const nx=(idx+1)%N,v=ring[idx];d[i]=v;ring[idx]=decay*0.5*(v+ring[nx]);idx=nx;if(Math.abs(v)>pk)pk=Math.abs(v);}
  const k=0.9/(pk||1);for(let i=0;i<len;i++)d[i]*=k;
  return ksCache[key]=b;
}
let distCurve=null;
function pluck(f,mode,t,gain){
  t=t??ctx.currentTime;
  const s=ctx.createBufferSource();const elec=mode==='elec';
  s.buffer=ksBuf(f,elec?0.9:0.55,elec?0.9985:0.996);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=elec?4800:3200;
  let node=lp;
  if(elec){
    if(!distCurve){distCurve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;distCurve[i]=Math.tanh(x*14);}}
    const ws=ctx.createWaveShaper();ws.curve=distCurve;ws.oversample='2x';lp.connect(ws);node=ws;
  }
  const g=ctx.createGain();g.gain.setValueAtTime((gain||0.5)*(elec?0.45:1),t);g.gain.setValueAtTime((gain||0.5)*(elec?0.45:1),t+1.7);g.gain.linearRampToValueAtTime(0,t+2.2);
  s.connect(lp);node.connect(g);out(g,elec?0.1:0.18);s.start(t);
}

let pbus=null;
function pianoBus(){
  if(pbus&&pbus.ctx===ctx)return pbus.in;
  const inp=ctx.createGain();inp.gain.value=1;
  const body=ctx.createBiquadFilter();body.type='peaking';body.frequency.value=260;body.Q.value=.8;body.gain.value=3;
  const warm=ctx.createBiquadFilter();warm.type='lowshelf';warm.frequency.value=180;warm.gain.value=2;
  const air=ctx.createBiquadFilter();air.type='highshelf';air.frequency.value=5200;air.gain.value=-4;
  inp.connect(body);body.connect(warm);warm.connect(air);
  const dry=ctx.createGain();dry.gain.value=.9;air.connect(dry);dry.connect(master);
  const wet=ctx.createGain();wet.gain.value=.55;air.connect(wet);wet.connect(reverbIn);
  pbus={ctx,in:inp};return inp;
}
function pianoNote(s,vel){
  const f=nf(s),t=ctx.currentTime,reg=clamp((s+28)/56,0,1);
  const bus=pianoBus();
  const B=0.00012*Math.pow(1.065,s+24);                       // inharmonicitet (stigande mot diskanten)
  const out_=ctx.createGain();out_.gain.setValueAtTime(vel*.2,t);
  const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
  if(pan){pan.pan.value=clamp((s-2)/50,-.6,.6);out_.connect(pan);pan.connect(bus);}else out_.connect(bus);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(9000,1800+vel*3400+reg*2600),t);lp.frequency.setTargetAtTime(1500+reg*900,t,.9);lp.Q.value=.4;
  lp.connect(out_);
  const T1=9*Math.pow(.42,reg*1.6);                           // grundtonens avklingning (lågt = lång, högt = kort)
  const oscs=[];
  const nP=Math.min(16,Math.max(4,Math.floor(8500/f)));
  for(let n=1;n<=nP;n++){
    const fn=f*n*Math.sqrt(1+B*n*n);if(fn>11000)break;
    let amp=Math.pow(n,-0.95)*(0.55+0.45*Math.abs(Math.sin(n*Math.PI*0.135)))*(n===1?1:(0.75+vel*.5));
    if(n===2)amp*=1.15;
    const Tn=Math.max(.25,T1/(1+.7*(n-1)));
    const pg=ctx.createGain();pg.gain.setValueAtTime(0.0001,t);pg.gain.linearRampToValueAtTime(amp,t+.0025);
    pg.gain.setTargetAtTime(amp*.32,t+.0025,.08+.1/n);          // snabb första dämpning (anslagets "bloom")
    pg.gain.setTargetAtTime(0.00005,t+.35,Tn/3.2);               // lång efterklang
    pg.connect(lp);
    const strings=n<=6?3:2,spread=(.5+reg*.7)*(n>3?1.4:1);
    for(let k=0;k<strings;k++){
      const o=ctx.createOscillator();o.type='sine';o.frequency.value=fn;
      o.detune.value=(k-(strings-1)/2)*spread*(1+n*.05);
      const sg=ctx.createGain();sg.gain.value=1/strings;o.connect(sg);sg.connect(pg);o.start(t);oscs.push(o);
    }
  }
  // hammarslag: kort filt-dunk + klick
  nz({t,type:'lowpass',f:520,q:.7,dur:.07,peak:.22*vel});
  nz({t,type:'bandpass',f:clamp(f*3.2,900,4200),q:1.1,dur:.022,peak:.2*vel});

  return {release(){
    if(done)return;done=true;const n=ctx.currentTime,r=.14+(1-reg)*.32;      // dämparen faller
    out_.gain.cancelScheduledValues(n);out_.gain.setValueAtTime(Math.max(out_.gain.value,.0002),n);
    out_.gain.setTargetAtTime(.00005,n,r/3.5);
    oscs.forEach(o=>{try{o.stop(n+r+.6)}catch(e){}});
  }};
}

    for(const r of R.rests){
      const yb=hitY-(r.s-R.pos)*ppb,yt=yb-r.len*ppb;if(yb<0||yt>hitY)continue;
      const t0=Math.max(yt,0),t1=Math.min(yb,hitY);
      g2.fillStyle='rgba(255,255,255,.14)';g2.fillRect(0,t0,W,t1-t0);
      g2.setLineDash([8,6]);g2.strokeStyle='rgba(255,255,255,.7)';g2.lineWidth=2;g2.strokeRect(3,yt+1,W-6,yb-yt-2);g2.setLineDash([]);
      if(yb-yt>26){g2.fillStyle='#fff';g2.font='800 '+clamp(fs+3,12,20)+'px sans-serif';g2.textAlign='center';g2.textBaseline='middle';
        g2.fillText('🤫 '+r.label,W/2,(yt+yb)/2-(R.wait?8:0));
        if(R.wait&&R.mode==='play'&&R.pos>=r.s&&R.pos<=r.s+r.len){const f=1-(R.pos-r.s)/r.len;g2.fillStyle='rgba(255,255,255,.25)';rr(W*.2,(yt+yb)/2+4,W*.6,10,5);g2.fill();g2.fillStyle='#ffd54a';rr(W*.2,(yt+yb)/2+4,Math.max(8,W*.6*f),10,5);g2.fill();}}
    }
    // noter
    for(const n of R.notes){
      const c=R.cols[n.col];if(!c)continue;
      const yb=hitY-(n.s-R.pos)*ppb,h=Math.max(n.len*ppb-4,16),yt=yb-h-(n.len*ppb-4>16?0:0);
      if(yb<-4||yt>hitY+30)continue;
      g2.globalAlpha=n.missed?.3:(n.hit?.35:1);
      rr(c.x+2,yt,c.w-4,h,Math.min(10,c.w/3));g2.fillStyle=c.c;g2.fill();g2.lineWidth=2.5;g2.strokeStyle='#fff';g2.stroke();
      if(n.len>=1.5){g2.strokeStyle='rgba(255,255,255,.75)';g2.lineWidth=3;g2.beginPath();g2.moveTo(c.x+c.w/2,yt+8);g2.lineTo(c.x+c.w/2,yt+h-8);g2.stroke();}
      if(h>=18&&c.w>=14){g2.fillStyle='#fff';g2.font='900 '+fs+'px sans-serif';g2.textAlign='center';g2.textBaseline='middle';g2.shadowColor='rgba(0,0,0,.5)';g2.shadowBlur=3;
        g2.fillText(c.key||c.n,c.x+c.w/2,yb-Math.min(h/2,12));g2.shadowBlur=0;}
      g2.globalAlpha=1;
    }
  }
  // träfflinje
  g2.save();g2.shadowColor='#ffd54a';g2.shadowBlur=14;g2.fillStyle='#ffd54a';g2.fillRect(0,hitY-3,W,6);g2.restore();
  // blixt vid träff
  const now=performance.now();
  for(const k in R.flash){const a=1-(now-R.flash[k])/350;if(a<=0){delete R.flash[k];continue;}const c=R.cols[k];if(!c)continue;g2.globalAlpha=a;g2.fillStyle='#fff';g2.beginPath();g2.arc(c.x+c.w/2,hitY,Math.min(c.w,60)*.6*(1.4-a*.4),0,7);g2.fill();g2.globalAlpha=1;}
  // spår-etiketter längst ned
  g2.font='800 '+fs+'px sans-serif';g2.textAlign='center';g2.textBaseline='middle';
  R.cols.forEach(c=>{g2.fillStyle=c.c;rr(c.x+2,hitY+6,c.w-4,H-hitY-8,6);g2.fill();g2.fillStyle='#fff';if(c.w>16)g2.fillText(c.key||c.n,c.x+c.w/2,hitY+6+(H-hitY-8)/2);});
  // poäng / hjälptext
  g2.textAlign='left';g2.textBaseline='top';g2.fillStyle='#fff';g2.font='800 14px sans-serif';
  if(R.mode==='play'&&R.state!=='idle')g2.fillText('⭐ '+R.score+(R.combo>2?'   🔥 x'+R.combo:''),8,6);
  else if(R.mode==='demo'&&R.state==='running')g2.fillText('👂 Lyssna...',8,6);
  else if(R.mode==='free'){g2.font='800 15px sans-serif';g2.fillText('🎨 Fri lek – spela som du vill!',8,6);}
  else if(R.state==='idle'){g2.font='800 14px sans-serif';g2.fillText('Tryck 👂 Lyssna först eller ▶️ Spela själv',8,6);}
  if(R.waiting&&R.state==='running'){g2.textAlign='center';g2.fillStyle='#ffd54a';g2.font='900 16px sans-serif';g2.fillText('⏳ Tryck på rätt ton!',W/2,6);}
}
function feedback(txt){const f=$('#fb');f.textContent=txt;f.classList.remove('show');void f.offsetWidth;f.classList.add('show');}
function showOv(txt,hint){const o=$('#ov');o.textContent=txt;o.hidden=false;o.classList.toggle('hint',!!hint);}
function hideOv(){$('#ov').hidden=true;}
function confetti(){
  const st=$('#stage'),cols=['#ff4d4d','#ff9d3b','#f7c600','#2fc96b','#3b9cff','#b05bff','#ff5bb5'];
  for(let i=0;i<70;i++){const c=el('i','cf');c.style.left=Math.random()*100+'%';c.style.background=cols[i%7];c.style.animationDelay=Math.random()*.8+'s';c.style.animationDuration=(1.8+Math.random()*1.6)+'s';c.style.borderRadius=i%3?'2px':'50%';st.append(c);setTimeout(()=>c.remove(),4200);}
}
function clearTimers(){R.timers.forEach(clearTimeout);R.timers=[];if(R.poll){clearInterval(R.poll);R.poll=null;}}
function stopRun(){
  clearTimers();R.state='idle';R.waiting=false;hideOv();$('#stop').hidden=true;
  $$('#play .on').forEach(e=>{if(![...ptrs.values()].some(p=>p.el===e))e.classList.remove('on');});
}
function nextNote(){return R.notes.find(n=>!n.hit&&!n.missed);}
function finish(){
  R.state='done';$('#stop').hidden=true;
  if(R.mode==='play'){
    const tot=R.notes.length,pct=tot?R.hits/tot:0,stars=pct>=.9?'🌟🌟🌟':pct>=.6?'🌟🌟':'🌟';
    showOv('🎉 Bra jobbat Alba! '+stars+'\n'+R.hits+' av '+tot+' toner');confetti();feedback('🎉');
    R.timers.push(setTimeout(()=>{hideOv();R.state='idle';},3800));
  }else{R.state='idle';}
}
function tickRun(dt){
  if(R.state!=='running'||R.mode==='free')return;
  R.pos+=dt/1000*R.bpm/60;
  if(R.wait&&R.mode==='play'){
    const nx=nextNote();R.waiting=false;
    if(nx&&R.pos>=nx.s){R.pos=nx.s;R.waiting=true;}
  }
  const b=Math.floor(R.pos);
  if(b>R.lastB){R.lastB=b;if(R.metro&&ctx&&!R.waiting)lastBeatClick(b%4===0);}
  if(R.mode==='demo'){
    for(const n of R.notes){
      if(!n.demoed&&R.pos>=n.s){
        n.demoed=true;
        const h=ins.down(n.t,true);lit(n.t,true);R.flash[n.col]=performance.now();
        R.timers.push(setTimeout(()=>{ins.up(h);lit(n.t,false);},Math.max(80,n.len*60000/R.bpm*.85)));
      }
    }
  }else if(!R.wait){
    const miss=.3*R.bpm/60;
    for(const n of R.notes){if(!n.hit&&!n.missed&&R.pos>n.s+miss){n.missed=true;R.combo=0;}}
  }
  if(R.pos>R.end+1.2)finish();
}
function onPress(t){
  if(R.mode!=='play'||R.state!=='running')return;
  const col=ins.lane.indexOf(t);if(col<0)return;
  const msb=60000/R.bpm;
  if(R.wait){
    const nx=nextNote();
    if(nx&&nx.t===t&&nx.s-R.pos<=.6){nx.hit=true;R.waiting=false;R.hits++;R.combo++;R.score+=100;R.flash[col]=performance.now();feedback(R.combo>3?'🌟 Perfekt i takt!':'✨ Snyggt!');}
    return;
  }
  let best=null,bd=1e9;
  for(const n of R.notes){if(n.hit||n.missed||n.t!==t)continue;const d=Math.abs(n.s-R.pos)*msb;if(d<bd){bd=d;best=n;}}
  if(best&&bd<=300){
    best.hit=true;R.hits++;R.combo++;R.flash[col]=performance.now();
    if(bd<=130){R.score+=100+R.combo*5;feedback('🌟 Perfekt i takt!');}else{R.score+=50;feedback('✨ Snyggt!');}
  }
}
function stageVisible(){
  const a=$('#laneWrap').getBoundingClientRect(),b=$('#inst').getBoundingClientRect();
  return a.top>=-2&&b.bottom<=window.innerHeight+2;
}
function beginRun(){
  R.state='running';R.pos=-2.2;R.lastB=Math.floor(R.pos)-1;hideOv();$('#stop').hidden=false;
}
function startMode(mode){
  stopRun();R.mode=mode;buildSong();resetRun();updateModes();
  if(mode==='free'){return;}
  if(mode==='demo'){beginRun();return;}
  // Spela själv: smart skroll-väntan + nedräkning
  const go=()=>{
    if(R.poll){clearInterval(R.poll);R.poll=null;}
    R.state='countdown';$('#stop').hidden=false;
    const steps=['3','2','1','🎶'],iv=60000/R.bpm;
    steps.forEach((s,k)=>R.timers.push(setTimeout(()=>{showOv(s);if(ctx&&R.metro)lastBeatClick(k===3);},k*iv)));
    R.timers.push(setTimeout(beginRun,steps.length*iv));
  };
  if(stageVisible()){go();return;}
  R.state='scrollwait';$('#stop').hidden=false;
  showOv('👇 Skrolla ner så att hela rytmbanan och instrumentet syns...',true);
  try{$('#stage').scrollIntoView({behavior:'smooth',block:'end'});}catch(e){}
  const t0=performance.now();
  R.poll=setInterval(()=>{if(stageVisible()||performance.now()-t0>6000){go();}},180);
  $('#ov').onclick=()=>{if(R.state==='scrollwait')go();};
}
function updateModes(){
  $$('#modes .btn').forEach(b=>b.classList.toggle('on',b.dataset.m===R.mode));
  $('#wait').classList.toggle('on',R.wait);$('#wait').textContent='⏳ Vänta på mig: '+(R.wait?'På':'Av');
  $('#metro').classList.toggle('on',R.metro);$('#metro').textContent='🔔 Metronom: '+(R.metro?'På':'Av');
}

/* ================= SPEL & INPUT ================= */
function press(i,id,el_){
  initAudio();if(!ctx)return null;
  let h=null;try{h=ins.down(i);}catch(e){console.error(e);}
  if(el_)el_.classList.add('on');
  onPress(i);return h;
}
function engage(pid,e){
  const i=+e.dataset.t;const h=press(i,pid,e);ptrs.set(pid,{el:e,h});
}
function disengage(p){
  try{ins.up(p.h);}catch(e){}
  if(p.el)p.el.classList.remove('on');
}
function releaseAll(){
  ptrs.forEach(disengage);ptrs.clear();
  for(const k in kdown){disengage(kdown[k]);}kdown={};
}
const playEl=$('#play');
playEl.addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest('[data-t]');if(!t)return;
  e.preventDefault();if(ptrs.has(e.pointerId))disengage(ptrs.get(e.pointerId));engage(e.pointerId,t);
});
window.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(p.el&&p.el.dataset.g===undefined)return;
  const u=document.elementFromPoint(e.clientX,e.clientY),t=u&&u.closest&&u.closest('#play [data-t]');
  if(t&&t===p.el)return;
  if(t&&t.dataset.g!==undefined){disengage(p);engage(e.pointerId,t);}
  else if(!t&&p.el){disengage(p);p.el=null;p.h=null;}
});
function endPtr(e){const p=ptrs.get(e.pointerId);if(!p)return;disengage(p);ptrs.delete(e.pointerId);}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
playEl.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target&&e.target.tagName;if(tg==='SELECT'||tg==='INPUT')return;
  if(e.key===' '){e.preventDefault();if(!e.repeat){initAudio();if(ctx)ins.space&&ins.space();}return;}
  const k=e.key.toLowerCase(),i=kmap[k];
  if(i===undefined)return;
  e.preventDefault();if(e.repeat||kdown[k])return;
  const el_=$('#play [data-t="'+i+'"]');
  const h=press(i,'k'+k,el_);kdown[k]={el:el_,h};
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();const p=kdown[k];if(p){disengage(p);delete kdown[k];}});
window.addEventListener('blur',releaseAll);

function setInstrument(idx){
  releaseAll();cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];
  if(R.state!=='idle'&&R.mode==='demo')stopRun();
  ins=INS[idx];
  $$('#tabs .tab').forEach((t,k)=>t.classList.toggle('on',k===idx));
  $('#tools').innerHTML='';$('#play').innerHTML='';
  ins.build($('#play'),$('#tools'));
  // tangenter
  kmap={};
  ins.lane.forEach((ti,k)=>{if(KEYS[k]&&ins.tracks[ti].key==null)ins.tracks[ti].key=KEYS[k];});
  if(ins.keyList)for(const ti in ins.keyList)ins.tracks[ti].key=ins.keyList[ti];
  ins.tracks.forEach((t,i)=>{
    if(!t.key)return;
    if(t.key!==' ')kmap[t.key]=i;
    const node=$('#play [data-t="'+i+'"]');
    if(node&&t.key!==' ')node.append(el('span','kb',t.key.toUpperCase()));
  });
  buildSong();resetRun();
  requestAnimationFrame(()=>{layoutCols();});
  setTimeout(layoutCols,120);
  if(R.state==='running'&&R.mode==='play'){startMode('free');}
}
function buildUI(){
  const tabs=$('#tabs');
  INS.forEach((x,i)=>{const b=el('button','tab','<span class="ic">'+x.icon+'</span><span class="nm">'+x.name+'</span>');b.onclick=()=>setInstrument(i);tabs.append(b);});
  const sel=$('#song');SONGS.forEach((s,i)=>{const o=el('option',null,s.name);o.value=i;sel.append(o);});
  sel.onchange=()=>{R.song=SONGS[+sel.value];const m=R.mode;stopRun();buildSong();resetRun();if(m!=='free')R.mode='free';updateModes();};
  const tp=$('#tempo');[['🐢 Långsam',66],['🚶 Lagom',86],['🐇 Snabb',110]].forEach(([l,v])=>{const b=el('button','btn sm'+(v===86?' on':''),l);b.onclick=()=>{R.bpm=v;$$('#tempo .btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');};tp.append(b);});
  const md=$('#modes');[['👂 Lyssna först','demo'],['▶️ Spela själv','play'],['🎨 Fri lek','free']].forEach(([l,m])=>{const b=el('button','btn sm',l);b.dataset.m=m;b.onclick=()=>startMode(m);md.append(b);});
  $('#wait').onclick=()=>{R.wait=!R.wait;updateModes();};
  $('#metro').onclick=()=>{R.metro=!R.metro;updateModes();};
  $('#stop').onclick=()=>{stopRun();R.mode='free';updateModes();};
  updateModes();
}
/* helskärm */
function setCompact(on){document.body.classList.toggle('compact',on);$('#fs').textContent=on?'⛶ Avsluta helskärm':'⛶ Helskärm';setTimeout(()=>{sizeCanvas();},80);}
$('#fs').onclick=async()=>{
  const d=document,de=d.documentElement,inFs=d.fullscreenElement||d.webkitFullscreenElement;
  if(inFs){try{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}return;}
  if(document.body.classList.contains('compact')){setCompact(false);return;}
  const rq=de.requestFullscreen||de.webkitRequestFullscreen;
  if(rq&&(d.fullscreenEnabled||d.webkitFullscreenEnabled)){
    try{await Promise.resolve(rq.call(de));}catch(e){setCompact(true);}
  }else setCompact(true);
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{setCompact(!!(document.fullscreenElement||document.webkitFullscreenElement));}));
/* stående-banner */
(function(){
  const mq=window.matchMedia('(orientation: portrait)'),b=$('#rot');let closed=false;
  const upd=()=>{b.hidden=closed||!(mq.matches&&window.innerWidth<800);};
  $('#rotx').onclick=()=>{closed=true;upd();};
  (mq.addEventListener?mq.addEventListener('change',upd):mq.addListener(upd));window.addEventListener('resize',upd);upd();
})();

/* start */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(50,now-lastT);lastT=now;
  if(!document.hidden)tickRun(dt);
  draw();requestAnimationFrame(frame);
}
buildUI();setInstrument(0);
sizeCanvas();
if(window.ResizeObserver){const ro=new ResizeObserver(()=>sizeCanvas());ro.observe($('#laneWrap'));ro.observe($('#play'));}
window.addEventListener('resize',sizeCanvas);window.addEventListener('orientationchange',()=>setTimeout(sizeCanvas,250));
requestAnimationFrame(frame);
</script>
